name: Audit
on:
  pull_request:
    paths: [uv.lock, pyproject.toml, .github/workflows/audit.yml]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_LOCKED: "1"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - run: make audit
